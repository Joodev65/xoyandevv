<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — JjooooNime</title>
  <meta name="description" content="Watch anime episodes online in HD quality on JjooooNime.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .watch-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 var(--container-padding);
    }
    .watch-main { min-width: 0; }
    .watch-sidebar { position: sticky; top: calc(var(--navbar-height) + 24px); height: fit-content; }

    @media (max-width: 1024px) {
      .watch-layout { grid-template-columns: 1fr; }
      .watch-sidebar { position: static; }
    }

    .download-section {
      margin-top: 24px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .download-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .download-list { padding: 12px; }
    .download-quality {
      margin-bottom: 16px;
    }
    .download-quality-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      padding: 0 8px;
    }
    .download-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 8px;
    }
    .download-link {
      padding: 6px 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      transition: var(--transition-fast);
    }
    .download-link:hover {
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }
    .watch-info {
      margin-top: 24px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      padding: 20px;
    }
    .watch-info-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .watch-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .watch-info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .watch-info-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .watch-info-value {
      font-size: 0.9rem;
      font-weight: 500;
    }
    .watch-info-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .watch-info-genres .genre-tag {
      padding: 4px 10px;
      font-size: 0.7rem;
    }
  </style>
</head>
<body data-page="watch">
  <div class="top-loader"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span class="text-gradient">JjooooNime</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/schedule.html" class="nav-link">Schedule</a>
        <a href="/search.html" class="nav-link">Genres</a>
        <a href="/history.html" class="nav-link">History</a>
        <a href="/bookmark.html" class="nav-link">Bookmarks</a>
      </div>
      <div class="nav-actions">
        <button class="nav-btn search-btn" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <a href="/bookmark.html" class="nav-btn bookmark-btn" aria-label="Bookmarks">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          <span class="badge"></span>
        </a>
        <a href="/history.html" class="nav-btn" aria-label="History">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </a>
        <button class="nav-btn mobile-menu-btn" aria-label="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Search Overlay -->
  <div class="search-overlay">
    <button class="search-close">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="search-box">
      <div class="search-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input" placeholder="Search anime..." autocomplete="off">
      </div>
    </div>
    <div class="search-results"></div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu">
    <div class="mobile-menu-backdrop"></div>
    <div class="mobile-menu-panel">
      <div class="mobile-menu-header">
        <a href="/" class="logo">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </div>
          <span class="text-gradient">JjooooNime</span>
        </a>
        <button class="mobile-menu-close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="mobile-menu-links">
        <a href="/" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
        <a href="/schedule.html" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Schedule</a>
        <a href="/search.html" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Search</a>
        <a href="/history.html" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>History</a>
        <a href="/bookmark.html" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Bookmarks</a>
      </div>
    </div>
  </div>

  <main class="page-content">
    <div class="watch-layout">
      <div class="watch-main">
        <!-- Player -->
        <div class="player-container" id="player-container">
          <div class="player-wrapper" id="player-wrapper">
            <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted);background:var(--bg-secondary)">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px;animation:spin 1s linear infinite"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
            </div>
          </div>
          <div class="player-controls">
            <div class="player-nav">
              <a href="#" class="btn btn-secondary btn-sm" id="prev-episode-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Prev
              </a>
              <a href="#" class="btn btn-secondary btn-sm" id="next-episode-btn">
                Next
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </a>
            </div>
            <div class="quality-selector" id="quality-selector"></div>
          </div>
        </div>

        <!-- Server Selector -->
        <div style="margin-top:16px" id="server-section">
          <div class="player-container" style="padding:16px 20px">
            <div style="font-weight:600;margin-bottom:12px;font-size:0.9rem">Select Server</div>
            <div class="server-selector" id="server-selector"></div>
          </div>
        </div>

        <!-- Episode Info -->
        <div class="watch-info" id="watch-info">
          <div class="watch-info-title" id="episode-title">Loading...</div>
          <div class="watch-info-grid" id="info-grid"></div>
        </div>

        <!-- Download Section -->
        <div class="download-section" id="download-section" style="display:none">
          <div class="download-header">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Download Links
          </div>
          <div class="download-list" id="download-list"></div>
        </div>
      </div>

      <div class="watch-sidebar">
        <!-- Episode List -->
        <div class="episode-list" id="sidebar-episode-list">
          <div class="episode-list-header">
            <h3 class="episode-list-title">Episodes</h3>
          </div>
          <div class="episode-grid" id="sidebar-episode-grid" style="max-height:600px">
            <div class="episode-item skeleton" style="height:40px"></div>
            <div class="episode-item skeleton" style="height:40px"></div>
            <div class="episode-item skeleton" style="height:40px"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    let currentEpisode = null;
    let currentServers = [];
    let currentQuality = '720p';
    let animeData = null;

    async function initWatchPage() {
      const params = new URLSearchParams(window.location.search);
      const episodeId = params.get('id');

      if (!episodeId) {
        window.location.href = '/';
        return;
      }

      UI.showLoader();

      try {
        const data = await API.watch(episodeId);
        const episode = data.data;
        currentEpisode = episode;

        if (!episode) {
          document.querySelector('.watch-layout').innerHTML = UI.createEmptyState(
            ICONS.alertCircle,
            'Episode Not Found',
            'The episode you are looking for does not exist.',
            { href: '/', text: 'Go Home' }
          );
          return;
        }

        // Update title
        document.title = `${episode.title} — JjooooNime`;
        document.getElementById('episode-title').textContent = episode.title;

        // Save to history
        Store.addHistory({
          animeId: episode.animeId,
          episodeId: episodeId,
          title: episode.title,
          thumbnail: '',
          url: window.location.href,
          timestamp: Date.now(),
          progress: 0
        });

        // Set initial player
        if (episode.defaultStreamingUrl) {
          loadPlayer(episode.defaultStreamingUrl);
        }

        // Render servers
        renderServers(episode.server?.qualities || []);

        // Render downloads
        renderDownloads(episode.downloadUrl?.qualities || []);

        // Render info
        renderInfo(episode.info);

        // Render episode list
        renderEpisodeList(episode.info?.episodeList || []);

        // Navigation buttons
        updateNavigation(episode);

      } catch (err) {
        console.error('Watch page error:', err);
        UI.toast('Failed to load episode', 'error');
      } finally {
        UI.hideLoader();
      }
    }

    function loadPlayer(url) {
      const wrapper = document.getElementById('player-wrapper');
      if (url.includes('embed') || url.includes('iframe')) {
        wrapper.innerHTML = `<iframe src="${url}" allowfullscreen sandbox="allow-same-origin allow-scripts allow-popups"></iframe>`;
      } else {
        wrapper.innerHTML = `<iframe src="${url}" allowfullscreen sandbox="allow-same-origin allow-scripts allow-popups"></iframe>`;
      }
    }

    function renderServers(qualities) {
      const selector = document.getElementById('server-selector');
      if (!selector) return;

      let allServers = [];
      qualities.forEach(q => {
        if (q.serverList) {
          q.serverList.forEach(s => {
            allServers.push({ ...s, quality: q.title });
          });
        }
      });

      currentServers = allServers;

      if (allServers.length === 0) {
        selector.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem">No servers available</span>';
        return;
      }

      selector.innerHTML = allServers.map((s, i) => `
        <button class="server-btn ${i === 0 ? 'active' : ''}" 
                onclick="switchServer('${s.serverId}', this)"
                data-server-id="${s.serverId}">
          ${s.title} ${s.quality}
        </button>
      `).join('');

      // Auto load first server
      if (allServers[0]) {
        switchServer(allServers[0].serverId, selector.querySelector('.server-btn'));
      }
    }

    async function switchServer(serverId, btn) {
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');

      try {
        const data = await API.server(serverId);
        if (data.data?.url) {
          loadPlayer(data.data.url);
        }
      } catch (err) {
        UI.toast('Failed to load server', 'error');
      }
    }

    function renderDownloads(qualities) {
      const section = document.getElementById('download-section');
      const list = document.getElementById('download-list');

      if (!qualities || qualities.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      list.innerHTML = qualities.map(q => `
        <div class="download-quality">
          <div class="download-quality-title">${q.title} ${q.size ? `(${q.size})` : ''}</div>
          <div class="download-links">
            ${q.urls?.map(u => `
              <a href="${u.url}" target="_blank" rel="noopener" class="download-link">${u.title}</a>
            `).join('') || ''}
          </div>
        </div>
      `).join('');
    }

    function renderInfo(info) {
      const grid = document.getElementById('info-grid');
      if (!info) return;

      const genres = info.genreList?.map(g => 
        `<a href="/search.html?genre=${g.genreId}" class="genre-tag">${g.title}</a>`
      ).join('') || '';

      grid.innerHTML = `
        ${info.credit ? `<div class="watch-info-item"><span class="watch-info-label">Credit</span><span class="watch-info-value">${info.credit}</span></div>` : ''}
        ${info.encoder ? `<div class="watch-info-item"><span class="watch-info-label">Encoder</span><span class="watch-info-value">${info.encoder}</span></div>` : ''}
        ${info.duration ? `<div class="watch-info-item"><span class="watch-info-label">Duration</span><span class="watch-info-value">${info.duration}</span></div>` : ''}
        ${info.type ? `<div class="watch-info-item"><span class="watch-info-label">Type</span><span class="watch-info-value">${info.type}</span></div>` : ''}
        ${genres ? `<div class="watch-info-item" style="grid-column:1/-1"><span class="watch-info-label">Genres</span><div class="watch-info-genres">${genres}</div></div>` : ''}
      `;
    }

    function renderEpisodeList(episodes) {
      const grid = document.getElementById('sidebar-episode-grid');
      if (!grid || !episodes) return;

      const history = Store.getHistory();
      const currentId = new URLSearchParams(window.location.search).get('id');

      grid.innerHTML = episodes.map(ep => {
        const isWatched = history.some(h => h.episodeId === ep.episodeId);
        const isActive = ep.episodeId === currentId;
        return `
          <a href="/watch.html?id=${ep.episodeId}" 
             class="episode-item ${isActive ? 'active' : ''} ${isWatched ? 'watched' : ''}">
            EP ${ep.eps}
          </a>
        `;
      }).join('');
    }

    function updateNavigation(episode) {
      const prevBtn = document.getElementById('prev-episode-btn');
      const nextBtn = document.getElementById('next-episode-btn');

      if (episode.hasPrevEpisode && episode.prevEpisode) {
        prevBtn.href = `/watch.html?id=${episode.prevEpisode.episodeId}`;
        prevBtn.style.visibility = 'visible';
      } else {
        prevBtn.style.visibility = 'hidden';
      }

      if (episode.hasNextEpisode && episode.nextEpisode) {
        nextBtn.href = `/watch.html?id=${episode.nextEpisode.episodeId}`;
        nextBtn.style.visibility = 'visible';
      } else {
        nextBtn.style.visibility = 'hidden';
      }
    }

    initWatchPage();
  </script>
</body>
</html>
