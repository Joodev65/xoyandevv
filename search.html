    </button>
    <div class="search-box">
      <div class="search-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input" placeholder="Search anime..." autocomplete="off">
      </div>
    </div>
    <div class="search-results"></div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu">
    <div class="mobile-menu-backdrop"></div>
    <div class="mobile-menu-panel">
      <div class="mobile-menu-header">
        <a href="/" class="logo">

        </button>

        <a href="/" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
        <a href="/schedule.html" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Schedule</a>
        <a href="/search.html" class="mobile-menu-link active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Search</a>

  <main class="page-content">
    <div class="container">
      <!-- Search Header -->
      <div style="text-align:center;padding:40px 0 32px">
        <h1 style="font-size:2rem;font-weight:800;margin-bottom:16px" id="search-title">Discover Anime</h1>
        <div style="max-width:600px;margin:0 auto">
          <div class="search-input-wrapper" style="background:var(--bg-card)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" class="search-input" id="main-search" placeholder="Search anime by title..." autocomplete="off">
          </div>
        </div>
      </div>

      <!-- Genres Filter -->
      <div class="section" id="genres-filter-section" style="padding-top:0">
        <div class="anime-detail-genres" id="genres-filter">
          <div class="genre-tag skeleton" style="width:80px;height:32px"></div>
          <div class="genre-tag skeleton" style="width:100px;height:32px"></div>
          <div class="genre-tag skeleton" style="width:90px;height:32px"></div>
        </div>
      </div>

      <!-- Results Grid -->
      <section class="section" style="padding-top:0">
        <div class="card-grid card-grid-lg" id="search-results">
          <div class="anime-card"><div class="card-poster skeleton skeleton-poster"></div><div class="card-info"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
          <div class="anime-card"><div class="card-poster skeleton skeleton-poster"></div><div class="card-info"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
          <div class="anime-card"><div class="card-poster skeleton skeleton-poster"></div><div class="card-info"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
          <div class="anime-card"><div class="card-poster skeleton skeleton-poster"></div><div class="card-info"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
          <div class="anime-card"><div class="card-poster skeleton skeleton-poster"></div><div class="card-info"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
          <div class="anime-card"><div class="card-poster skeleton skeleton-poster"></div><div class="card-info"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
        </div>
        <div id="pagination-container"></div>
      </section>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    let currentGenre = null;
    let currentPage = 1;
    let currentQuery = '';

    async function initSearchPage() {
      const params = new URLSearchParams(window.location.search);
      const genre = params.get('genre');
      const q = params.get('q');
      const page = parseInt(params.get('page')) || 1;

      currentGenre = genre;
      currentPage = page;
      currentQuery = q || '';

      // Load genres filter
      await loadGenresFilter();

      if (q) {
        document.getElementById('search-title').textContent = `Search: "${q}"`;
        document.getElementById('main-search').value = q;
        await performSearch(q);
      } else if (genre) {
        document.getElementById('search-title').textContent = `Genre: ${genre.charAt(0).toUpperCase() + genre.slice(1)}`;
        await loadGenre(genre, page);
      } else {
        document.getElementById('search-title').textContent = 'All Genres';
        // Show all genres as cards or load default genre
        await loadGenre('action', 1);
      }
    }

    async function loadGenresFilter() {
      try {
        const data = await API.genres();
        const genres = data.data?.genreList || [];
        const container = document.getElementById('genres-filter');

        if (container) {
          container.innerHTML = genres.map(g => `
            <a href="/search.html?genre=${g.genreId}" 
               class="genre-tag ${currentGenre === g.genreId ? 'active' : ''}"
               style="${currentGenre === g.genreId ? 'background:var(--accent-primary);border-color:var(--accent-primary);color:white' : ''}">
              ${g.title}
            </a>
          `).join('');
        }
      } catch (err) {
        console.error('Genres filter error:', err);
      }
    }

    async function performSearch(query) {
      UI.showLoader();
      const grid = document.getElementById('search-results');

      try {
        const data = await API.search(query);
        const results = data.data?.animeList || [];

        if (results.length === 0) {
          grid.innerHTML = UI.createEmptyState(
            ICONS.search,
            'No Results',
            `No anime found for "${query}"`,
            null
          );
          document.getElementById('pagination-container').innerHTML = '';
          return;
        }

        grid.innerHTML = results.map(anime => UI.createAnimeCard(anime)).join('');
        document.getElementById('pagination-container').innerHTML = '';

      } catch (err) {
        grid.innerHTML = UI.createEmptyState(
          ICONS.alertCircle,
          'Search Error',
          'Failed to search. Please try again.'
        );
      } finally {
        UI.hideLoader();
      }
    }

    async function loadGenre(genreId, page) {
      UI.showLoader();
      const grid = document.getElementById('search-results');

      try {
        const data = await API.genre(genreId, page);
        const animeList = data.data?.animeList || [];
        const pagination = data.data?.pagination || {};

        if (animeList.length === 0) {
          grid.innerHTML = UI.createEmptyState(
            ICONS.grid,
            'No Anime',
            'No anime found in this genre.',
            null
          );
          document.getElementById('pagination-container').innerHTML = '';
          return;
        }

        grid.innerHTML = animeList.map(anime => UI.createAnimeCard(anime)).join('');

        // Pagination
        if (pagination.totalPages > 1) {
          document.getElementById('pagination-container').innerHTML = UI.createPagination(
            pagination.currentPage,
            Math.min(pagination.totalPages, 100),
            `/search.html?genre=${genreId}`
          );
        }

      } catch (err) {
        grid.innerHTML = UI.createEmptyState(
          ICONS.alertCircle,
          'Error',
          'Failed to load genre. Please try again.'
        );
      } finally {
        UI.hideLoader();
      }
    }

    // Search input handler
    const searchInput = document.getElementById('main-search');
    if (searchInput) {
      let debounceTimer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        if (query) {
          debounceTimer = setTimeout(() => {
            window.history.replaceState({}, '', `/search.html?q=${encodeURIComponent(query)}`);
            performSearch(query);
          }, 500);
        }
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const query = e.target.value.trim();
          if (query) {
            Store.addSearch(query);
            window.location.href = `/search.html?q=${encodeURIComponent(query)}`;
          }
        }
      });
    }

    initSearchPage();
  </script>
</body>
</html>
