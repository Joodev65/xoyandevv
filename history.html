<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — JjooooNime</title>
  <meta name="description" content="Your watch history on JjooooNime.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="history">
  <div class="top-loader"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </div>
        <span class="text-gradient">JjooooNime</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/schedule.html" class="nav-link">Schedule</a>
        <a href="/search.html" class="nav-link">Genres</a>
        <a href="/history.html" class="nav-link active">History</a>
        <a href="/bookmark.html" class="nav-link">Bookmarks</a>
      </div>
      <div class="nav-actions">
        <button class="nav-btn search-btn" aria-label="Search">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </button>
        <a href="/bookmark.html" class="nav-btn bookmark-btn" aria-label="Bookmarks">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>
          <span class="badge"></span>
        </a>
        <a href="/history.html" class="nav-btn" aria-label="History">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </a>
        <button class="nav-btn mobile-menu-btn" aria-label="Menu">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
      </div>
    </div>
  </nav>

  <!-- Search Overlay -->
  <div class="search-overlay">
    <button class="search-close">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <div class="search-box">
      <div class="search-input-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" class="search-input" placeholder="Search anime..." autocomplete="off">
      </div>
    </div>
    <div class="search-results"></div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu">
    <div class="mobile-menu-backdrop"></div>
    <div class="mobile-menu-panel">
      <div class="mobile-menu-header">
        <a href="/" class="logo">
          <div class="logo-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </div>
          <span class="text-gradient">JjooooNime</span>
        </a>
        <button class="mobile-menu-close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="mobile-menu-links">
        <a href="/" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>Home</a>
        <a href="/schedule.html" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>Schedule</a>
        <a href="/search.html" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Search</a>
        <a href="/history.html" class="mobile-menu-link active"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>History</a>
        <a href="/bookmark.html" class="mobile-menu-link"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path></svg>Bookmarks</a>
      </div>
    </div>
  </div>

  <main class="page-content">
    <div class="container">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:40px 0 32px;flex-wrap:wrap;gap:16px">
        <div>
          <h1 style="font-size:2rem;font-weight:800;margin-bottom:4px">Watch History</h1>
          <p style="color:var(--text-muted)">Continue where you left off</p>
        </div>
        <button class="btn btn-secondary" onclick="clearAllHistory()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
          Clear History
        </button>
      </div>

      <!-- Continue Watching -->
      <section class="section" style="padding-top:0">
        <div class="section-header">
          <h2 class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            Continue Watching
          </h2>
        </div>
        <div class="history-grid" id="continue-watching"></div>
      </section>

      <!-- Watch History -->
      <section class="section">
        <div class="section-header">
          <h2 class="section-title">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Recently Watched
          </h2>
        </div>
        <div class="history-grid" id="watch-history"></div>
      </section>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    function initHistoryPage() {
      renderContinueWatching();
      renderWatchHistory();
    }

    function renderContinueWatching() {
      const container = document.getElementById('continue-watching');
      const watching = Store.getContinueWatching();

      if (watching.length === 0) {
        container.innerHTML = UI.createEmptyState(
          ICONS.play,
          'No Continue Watching',
          'Start watching anime to see them here.',
          { href: '/', text: 'Browse Anime' }
        );
        return;
      }

      container.innerHTML = watching.slice(0, 6).map(item => `
        <a href="${item.href || '/'}" class="history-card">
          <img src="${item.poster || ''}" alt="${item.title}" loading="lazy">
          <div class="history-card-info">
            <div class="history-card-title">${item.title}</div>
            <div class="history-card-time">${formatTime(item.timestamp)}</div>
            <div class="progress-bar">
              <div class="progress-bar-fill" style="width:${item.progress || 0}%"></div>
            </div>
          </div>
          <div class="card-actions">
            <button class="card-action-btn" onclick="event.preventDefault();removeContinueWatching('${item.animeId}')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </a>
      `).join('');
    }

    function renderWatchHistory() {
      const container = document.getElementById('watch-history');
      const history = Store.getHistory();

      if (history.length === 0) {
        container.innerHTML = UI.createEmptyState(
          ICONS.clock,
          'No Watch History',
          'Your watch history will appear here.',
          null
        );
        return;
      }

      container.innerHTML = history.map(item => `
        <a href="${item.url || '/'}" class="history-card">
          <div style="width:100px;height:150px;background:var(--bg-surface);border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          </div>
          <div class="history-card-info">
            <div class="history-card-title">${item.title}</div>
            <div class="history-card-episode">Episode ${item.episodeId?.split('-').find(p => !isNaN(p)) || ''}</div>
            <div class="history-card-time">${formatTime(item.timestamp)}</div>
          </div>
          <div class="card-actions">
            <button class="card-action-btn" onclick="event.preventDefault();removeHistory('${item.animeId}', '${item.episodeId}')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
            </button>
          </div>
        </a>
      `).join('');
    }

    function removeHistory(animeId, episodeId) {
      Store.removeHistory(animeId, episodeId);
      renderWatchHistory();
      UI.toast('Removed from history', 'info');
    }

    function removeContinueWatching(animeId) {
      Store.removeContinueWatching(animeId);
      renderContinueWatching();
      UI.toast('Removed from continue watching', 'info');
    }

    function clearAllHistory() {
      if (confirm('Are you sure you want to clear all history?')) {
        Store.clearHistory();
        localStorage.removeItem(STORAGE.CONTINUE_WATCHING);
        renderWatchHistory();
        renderContinueWatching();
        UI.toast('History cleared', 'success');
      }
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (minutes < 1) return 'Just now';
      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;
      return date.toLocaleDateString();
    }

    initHistoryPage();
  </script>
</body>
</html>
