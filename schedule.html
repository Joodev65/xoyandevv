  <main class="page-content">
    <div class="container">
      <div style="text-align:center;padding:40px 0 32px">
        <h1 style="font-size:2rem;font-weight:800;margin-bottom:8px">Weekly Schedule</h1>
        <p style="color:var(--text-muted)">Find out when your favorite anime airs</p>
      </div>

      <!-- Day Tabs -->
      <div class="schedule-tabs" id="schedule-tabs">
        <button class="schedule-tab active" data-day="all">All Days</button>
        <button class="schedule-tab" data-day="Senin">Monday</button>
        <button class="schedule-tab" data-day="Selasa">Tuesday</button>
        <button class="schedule-tab" data-day="Rabu">Wednesday</button>
        <button class="schedule-tab" data-day="Kamis">Thursday</button>
        <button class="schedule-tab" data-day="Jumat">Friday</button>
        <button class="schedule-tab" data-day="Sabtu">Saturday</button>
        <button class="schedule-tab" data-day="Minggu">Sunday</button>
      </div>

      <!-- Schedule Content -->
      <div id="schedule-content">
        <div class="schedule-grid">
          <div class="schedule-card"><div class="skeleton" style="width:80px;height:120px;border-radius:12px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
          <div class="schedule-card"><div class="skeleton" style="width:80px;height:120px;border-radius:12px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
          <div class="schedule-card"><div class="skeleton" style="width:80px;height:120px;border-radius:12px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton skeleton-text"></div><div class="skeleton skeleton-text short"></div></div></div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    let scheduleData = [];

    async function initSchedulePage() {
      UI.showLoader();

      try {
        const data = await API.schedule();
        scheduleData = data.data?.schedule || [];

        // Highlight today
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const today = days[new Date().getDay()];

        // Set today tab active by default
        document.querySelectorAll('.schedule-tab').forEach(tab => {
          tab.classList.remove('active');
          if (tab.dataset.day === today) {
            tab.classList.add('active');
          }
        });

        renderSchedule(today);

        // Tab handlers
        document.querySelectorAll('.schedule-tab').forEach(tab => {
          tab.addEventListener('click', () => {
            document.querySelectorAll('.schedule-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderSchedule(tab.dataset.day);
          });
        });

      } catch (err) {
        console.error('Schedule error:', err);
        document.getElementById('schedule-content').innerHTML = UI.createEmptyState(
          ICONS.alertCircle,
          'Failed to Load Schedule',
          'Could not load the weekly schedule. Please try again.'
        );
      } finally {
        UI.hideLoader();
      }
    }

    function renderSchedule(day) {
      const container = document.getElementById('schedule-content');

      let animeList = [];

      if (day === 'all') {
        scheduleData.forEach(d => {
          d.anime_list?.forEach(a => {
            animeList.push({ ...a, day: d.day });
          });
        });
      } else {
        const dayData = scheduleData.find(d => d.day === day);
        if (dayData) {
          animeList = dayData.anime_list.map(a => ({ ...a, day }));
        }
      }

      if (animeList.length === 0) {
        container.innerHTML = UI.createEmptyState(
          ICONS.calendar,
          'No Anime',
          `No anime scheduled for ${day === 'all' ? 'this week' : day}.`,
          null
        );
        return;
      }

      container.innerHTML = `
        <div class="schedule-grid">
          ${animeList.map(anime => `
            <a href="/anime.html?id=${anime.slug}" class="schedule-card">
              <img src="${anime.poster}" alt="${anime.title}" loading="lazy">
              <div class="schedule-card-info">
                <div class="schedule-card-title">${anime.title}</div>
                <div class="schedule-card-time">${anime.day}</div>
              </div>
            </a>
          `).join('')}
        </div>
      `;
    }

    initSchedulePage();
  </script>
</body>
</html>
