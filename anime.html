  <script src="/js/main.js"></script>
  <script>
    async function initAnimePage() {
      const params = new URLSearchParams(window.location.search);
      const animeId = params.get('id');

      if (!animeId) {
        window.location.href = '/';
        return;
      }

      UI.showLoader();

      try {
        const data = await API.anime(animeId);
        const anime = data.data;

        if (!anime) {
          document.getElementById('detail-content').innerHTML = UI.createEmptyState(
            ICONS.alertCircle,
            'Anime Not Found',
            'The anime you are looking for does not exist.',
            { href: '/', text: 'Go Home' }
          );
          return;
        }

        // Save to recently viewed
        Store.setContinueWatching({
          animeId: anime.animeId,
          title: anime.title,
          poster: anime.poster,
          href: `/anime.html?id=${anime.animeId}`,
          timestamp: Date.now()
        });

        // Update page title
        document.title = `${anime.title} — JjooooNime`;

        // Render detail
        const isBookmarked = Store.isBookmarked(anime.animeId);
        const bookmarkIcon = isBookmarked ? ICONS.bookmarkFilled : ICONS.bookmark;

        document.getElementById('detail-bg-img').src = anime.poster;
        document.getElementById('detail-bg-img').alt = anime.title;

        const synopsisHtml = anime.synopsis?.paragraphs?.length > 0 
          ? anime.synopsis.paragraphs.map(p => `<p>${p}</p>`).join('')
          : '<p>No synopsis available.</p>';

        const genresHtml = anime.genreList?.map(g => 
          `<a href="/search.html?genre=${g.genreId}" class="genre-tag">${g.title}</a>`
        ).join('') || '';

        const firstEpisode = anime.episodeList?.[anime.episodeList.length - 1];
        const watchHref = firstEpisode ? `/watch.html?id=${firstEpisode.episodeId}` : '#';

        document.getElementById('detail-content').innerHTML = `
          <div class="anime-detail-poster">
            <img src="${anime.poster}" alt="${anime.title}">
          </div>
          <div class="anime-detail-info">
            <h1 class="anime-detail-title">${anime.title}</h1>
            ${anime.japanese ? `<p class="anime-detail-japanese">${anime.japanese}</p>` : ''}
            <div class="anime-detail-meta">
              ${anime.score ? `<span class="anime-detail-meta-item">${ICONS.star} ${anime.score}</span>` : ''}
              ${anime.type ? `<span class="anime-detail-meta-item">${ICONS.tv} ${anime.type}</span>` : ''}
              ${anime.episodes ? `<span class="anime-detail-meta-item">${ICONS.film} ${anime.episodes} EPS</span>` : ''}
              ${anime.duration ? `<span class="anime-detail-meta-item">${ICONS.clock} ${anime.duration}</span>` : ''}
              ${anime.studios ? `<span class="anime-detail-meta-item">${ICONS.info} ${anime.studios}</span>` : ''}
              ${anime.aired ? `<span class="anime-detail-meta-item">${ICONS.calendar} ${anime.aired}</span>` : ''}
            </div>
            <div class="anime-detail-genres">${genresHtml}</div>
            <div class="anime-detail-synopsis">${synopsisHtml}</div>
            <div class="anime-detail-actions">
              <a href="${watchHref}" class="btn btn-primary btn-lg">
                ${ICONS.play} Watch Now
              </a>
              <button class="btn btn-secondary btn-lg" onclick="toggleBookmark('${anime.animeId}', '${anime.title.replace(/'/g, "\'")}', '${anime.poster}')">
                <span id="bookmark-icon">${bookmarkIcon}</span>
                <span id="bookmark-text">${isBookmarked ? 'Bookmarked' : 'Bookmark'}</span>
              </button>
              ${anime.batch ? `<a href="/batch.html?id=${anime.batch}" class="btn btn-secondary btn-lg">${ICONS.download} Batch</a>` : ''}
            </div>
          </div>
        `;

        // Render episodes
        const episodeGrid = document.getElementById('episode-grid');
        if (episodeGrid && anime.episodeList) {
          const history = Store.getHistory();
          episodeGrid.innerHTML = [...anime.episodeList].reverse().map(ep => {
            const isWatched = history.some(h => h.episodeId === ep.episodeId);
            return `
              <a href="/watch.html?id=${ep.episodeId}" 
                 class="episode-item ${isWatched ? 'watched' : ''}"
                 data-episode-id="${ep.episodeId}">
                EP ${ep.eps}
              </a>
            `;
          }).join('');
        }

        // Render recommendations
        const recGrid = document.getElementById('recommendations-grid');
        if (recGrid && anime.recommendedAnimeList) {
          recGrid.innerHTML = anime.recommendedAnimeList.map(a => UI.createAnimeCard(a)).join('');
        }

      } catch (err) {
        console.error('Anime detail error:', err);
        UI.toast('Failed to load anime details', 'error');
      } finally {
        UI.hideLoader();
      }
    }

    function toggleBookmark(animeId, title, poster) {
      const isBookmarked = Store.isBookmarked(animeId);
      if (isBookmarked) {
        Store.removeBookmark(animeId);
        document.getElementById('bookmark-icon').innerHTML = ICONS.bookmark;
        document.getElementById('bookmark-text').textContent = 'Bookmark';
        UI.toast('Removed from bookmarks', 'info');
      } else {
        Store.addBookmark({ animeId, title, poster, href: `/anime.html?id=${animeId}` });
        document.getElementById('bookmark-icon').innerHTML = ICONS.bookmarkFilled;
        document.getElementById('bookmark-text').textContent = 'Bookmarked';
        UI.toast('Added to bookmarks', 'success');
      }
      updateBookmarkBadge();
    }

    initAnimePage();
  </script>
